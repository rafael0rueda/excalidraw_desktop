# Known advisories against what the app ships.
#
# On a schedule rather than on every push: an advisory is news about a
# dependency, not about a commit, and as a step in CI it turned unrelated
# pushes red on the day one was published. A failure here means read the
# report, not that the last change broke something.
name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # The Rust half: tauri, wry, the gtk3-rs crates, serde. Fails on a
  # vulnerability; "unmaintained" and "unsound" notices are printed as
  # warnings. Two are known at the time of writing, both from Tauri's own
  # Linux stack: RUSTSEC-2024-0429 (glib 0.18's VariantStrIter, not reached
  # from settings.rs) and the gtk3-rs crates' unmaintained notices.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo audit --file iced/Cargo.lock
