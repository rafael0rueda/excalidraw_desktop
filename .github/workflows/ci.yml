# The gate every change in this repo is already held to by hand:
#   npm run check && npx tsc --noEmit && npx vite build && cargo test
# See PROGRESS.md for what each of those covers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The theme engine, the tab model and the CSP guard. No DOM, no
      # Excalidraw, no Tauri — esbuild bundles the pure modules and asserts
      # over them.
      - run: npm run check
      # `build` is `assets && tsc --noEmit && vite build`: the font copy has
      # to happen first or Excalidraw resolves its fonts from a CDN.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # webkit2gtk for Tauri itself; gtk and rsvg because this app talks to
      # GTK directly (the menu bar stylesheet, the clipboard, the portal).
      - name: Install the system libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # `tauri build` needs dist/ to exist; the tests do not, and this job
      # deliberately stays independent of the frontend one.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Never run before this workflow existed — the toolchain on the machine
      # this was developed on is Fedora's, which ships no clippy.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
