[package]
name = "excalidraw-desktop-core"
version = "0.0.0"
# Not the app's version: nothing publishes this crate, and `npm run bump`
# would otherwise have one more file to keep in step.
description = "What Excalidraw Desktop keeps on disk: config, session, recent files, themes, atomic writes"
authors = ["rafa"]
license = "MIT"
edition = "2021"
# Kept equal to src-tauri's, which builds this crate too.
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `flock` for the instance lock in store.rs. `File::lock` would need Rust
# 1.89, above `rust-version`.
libc = "0.2"
