[package]
name = "render"
version = "0.0.0"
description = "Excalidraw elements as paint operations: Excalidraw 0.18.1's shape code over the rough port"
authors = ["rafa"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
rough = { path = "../rough" }
scene = { path = "../scene" }
# ECMAScript number formatting: freedraw outlines go through a path string
# whose digits Excalidraw truncates, and that has to see the same digits.
ryu-js = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
