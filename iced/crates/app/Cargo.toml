[package]
name = "excalidraw-iced"
version = "0.0.0"
description = "Excalidraw Desktop on Iced (docs/iced-port/PLAN.md)."
authors = ["rafa"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
# Pinned exactly (plan W3): an upgrade is a deliberate change to this crate only.
# `smol`: timers, for autosave.
iced = { version = "=0.14.0", features = ["canvas", "image", "advanced", "smol"] }
scene = { path = "../scene" }
render = { path = "../render" }
excalidraw-desktop-core = { path = "../core" }
editor = { path = "../editor" }
export = { path = "../export" }
base64 = "0.22"
# File dialogs through the XDG desktop portal: no GTK.
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
serde_json = "1"
# The desktop's light or dark preference, from the XDG portal, as it
# changes. Already in the tree (iced's own theme detection uses it); asked
# directly so the answer is there before the first frame.
# Copy as PNG: iced's clipboard carries text only. Through X11 (XWayland
# on a Wayland desktop, which hands the image on to Wayland apps).
arboard = "3"
# Image ids: Excalidraw names an inserted file by its SHA-1.
sha1_smol = "1"
mundy = { version = "0.2", default-features = false, features = ["async-io", "color-scheme"] }

[build-dependencies]
fontmerge = { path = "../fontmerge" }
wuff = "0.2"
ttf-parser = "0.25"

