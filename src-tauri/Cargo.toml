[package]
name = "excalidraw-desktop"
version = "0.3.0"
description = "Local-first Excalidraw desktop app"
authors = ["rafa"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "excalidraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk-pixbuf = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
