[package]
name = "excalidraw-desktop"
version = "0.4.0"
description = "Local-first Excalidraw desktop app"
authors = ["rafa"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "excalidraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# A second launch (a file-manager double click) must not become a second app:
# two instances share one config directory and would prune each other's session.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk-pixbuf = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
